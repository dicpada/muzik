<!doctype html>
<!--
  My Jukebox — 파일 하나로 운영하는 유튜브 주크박스 (애플 뮤직 스타일)
  · 데이터: 아래 script의 ARTISTS(가수·노래)와 COVERS(앨범 표지, data URI)
  · 표지가 너무 많아져 파일이 무거워지면 covers/ 폴더로 분리
  · 유튜브 재생은 사이트에 올린 상태(https)에서 동작
  · 새 대화창에서: 이 파일을 올리고 "유튜브 링크·앨범 표지 보내면 가수별로 넣어줘, '다운받을게' 하면 파일 보내줘"
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Playfair+Display:ital,wght@0,600;1,600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c;
    --bg-raise:#151519;
    --bg-hover:#1d1d22;
    --line:rgba(255,255,255,.08);
    --text:#f2f1ee;
    --text-dim:#9a9a9e;
    --accent:#e0473c;
    --player-h:76px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter','Noto Sans KR',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
  }
  body{ padding-bottom:calc(var(--player-h) + env(safe-area-inset-bottom,0px) + 20px); }
  button{ font-family:inherit; color:inherit; }

  header{ padding:56px 6vw 26px; display:flex; flex-direction:column; gap:10px; }
  header h1{
    font-family:'Black Han Sans',sans-serif;
    font-size:clamp(30px,4.2vw,44px);
    letter-spacing:.01em; color:var(--accent);
  }
  header p.tagline{
    max-width:62ch; line-height:1.6; color:var(--text-dim);
    font-family:'Playfair Display',Georgia,serif; font-style:italic; font-size:15px;
  }
  header p.tagline em{ color:var(--text); }

  /* 툴바 */
  .toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:0 6vw 26px;
  }
  .stat{ font-size:13px; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .stat b{ color:var(--text); font-weight:600; }
  .tools{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .seg{ display:flex; background:var(--bg-raise); border:1px solid var(--line); border-radius:20px; padding:3px; }
  .seg button{
    font-size:12.5px; font-weight:600; color:var(--text-dim); background:none; border:0;
    padding:6px 13px; border-radius:16px; cursor:pointer; white-space:nowrap;
  }
  .seg button.active{ background:var(--accent); color:#fff; }
  .search-wrap{ position:relative; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; width:15px; height:15px; transform:translateY(-50%); color:var(--text-dim); }
  .search-input{
    width:240px; max-width:62vw; height:34px; padding:0 14px 0 34px;
    border-radius:20px; border:1px solid var(--line); background:var(--bg-raise);
    color:var(--text); font-size:13px; font-family:inherit;
  }
  .search-input:focus{ outline:none; border-color:rgba(255,255,255,.28); }

  /* 가수 그리드 (정사각 썸네일) */
  main{ padding:0 6vw; }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:30px 22px;
  }
  .card{ cursor:pointer; min-width:0; background:none; border:0; text-align:left; }
  .art{
    position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
    background:linear-gradient(135deg,#26262c,#141418);
    box-shadow:0 6px 22px rgba(0,0,0,.45);
  }
  .art img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .35s ease; }
  /* 유튜브 hqdefault(4:3)의 위아래 검은 띠를 잘라내기 */
  .art img.yt{ transform:scale(1.34); }
  .card:hover .art img{ transform:scale(1.05); }
  .card:hover .art img.yt{ transform:scale(1.4); }
  .art .initial{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Black Han Sans',sans-serif; font-size:56px; color:rgba(255,255,255,.18);
  }
  .art .play-fab{
    position:absolute; right:10px; bottom:10px; width:40px; height:40px; border-radius:50%;
    background:var(--accent); border:0; display:flex; align-items:center; justify-content:center;
    opacity:0; transform:translateY(6px); transition:all .2s ease; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.5);
  }
  .art .play-fab svg{ width:16px; height:16px; margin-left:2px; fill:#fff; }
  .card:hover .play-fab, .card:focus-visible .play-fab{ opacity:1; transform:none; }
  .card .name{ margin-top:10px; font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .sub{ margin-top:3px; font-size:12.5px; color:var(--text-dim); }
  .card.now .name{ color:var(--accent); }

  .empty{
    padding:70px 20px; text-align:center; color:var(--text-dim); font-size:14px; line-height:1.8;
    border:1px dashed var(--line); border-radius:14px;
  }
  .empty b{ color:var(--text); }

  /* 가수(앨범) 상세 */
  .detail{
    position:fixed; inset:0; z-index:40; background:var(--bg); overflow-y:auto;
    padding:calc(env(safe-area-inset-top,0px) + 22px) 6vw calc(var(--player-h) + 40px);
    opacity:0; visibility:hidden; transition:opacity .25s ease, visibility .25s;
  }
  .detail.open{ opacity:1; visibility:visible; }
  .detail-bg{
    position:fixed; inset:0 0 auto 0; height:420px; pointer-events:none; z-index:-1;
    background-size:cover; background-position:center; filter:blur(60px) saturate(1.3); opacity:.35;
    mask-image:linear-gradient(#000,transparent);
    -webkit-mask-image:linear-gradient(#000,transparent);
  }
  .back{
    display:inline-flex; align-items:center; gap:6px; background:none; border:0; cursor:pointer;
    color:var(--accent); font-size:14px; font-weight:600; padding:6px 0; margin-bottom:22px;
  }
  .back svg{ width:16px; height:16px; }
  .hero{ display:flex; gap:34px; align-items:flex-end; flex-wrap:wrap; margin-bottom:30px; }
  .hero .art{ width:min(260px,70vw); flex:none; border-radius:12px; box-shadow:0 14px 40px rgba(0,0,0,.6); }
  .hero .meta{ flex:1; min-width:220px; }
  .hero .kind{ font-size:11.5px; font-weight:700; letter-spacing:.14em; color:var(--text-dim); text-transform:uppercase; }
  .hero h2{ font-family:'Black Han Sans',sans-serif; font-weight:400; font-size:clamp(32px,5vw,52px); line-height:1.1; margin:8px 0 6px; }
  .hero .alt{ font-family:'Playfair Display',serif; font-style:italic; color:var(--text-dim); font-size:16px; }
  .hero .cnt{ margin-top:10px; font-size:13px; color:var(--text-dim); }
  .hero .actions{ display:flex; gap:10px; margin-top:20px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 22px; border-radius:10px;
    border:0; cursor:pointer; font-size:14px; font-weight:600;
  }
  .btn svg{ width:15px; height:15px; fill:currentColor; }
  .btn.primary{ background:var(--accent); color:#fff; }
  .btn.ghost{ background:var(--bg-raise); color:var(--accent); border:1px solid var(--line); }
  .btn:hover{ filter:brightness(1.12); }

  .tracks{ list-style:none; border-top:1px solid var(--line); }
  .track{
    display:grid; grid-template-columns:34px 1fr auto; align-items:center; gap:14px;
    padding:13px 10px; border-bottom:1px solid var(--line); cursor:pointer; border-radius:8px;
  }
  .track:hover{ background:var(--bg-hover); }
  .track .no{ font-size:13px; color:var(--text-dim); text-align:center; font-variant-numeric:tabular-nums; }
  .track .tt{ min-width:0; }
  .track .tt .t{ font-size:14.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .tt .m{ font-size:12px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track .yt-link{ color:var(--text-dim); padding:6px; border-radius:6px; display:flex; }
  .track .yt-link:hover{ color:var(--text); background:rgba(255,255,255,.06); }
  .track .yt-link svg{ width:16px; height:16px; }
  .track.playing .t, .track.playing .no{ color:var(--accent); }
  .badge{
    display:inline-block; margin-left:8px; padding:2px 6px; border-radius:4px; vertical-align:2px;
    font-size:9.5px; font-weight:700; letter-spacing:.08em; line-height:1.2;
    color:var(--text-dim); border:1px solid rgba(255,255,255,.22);
  }
  .track.playing .badge{ color:var(--accent); border-color:var(--accent); }
  .eq{ display:inline-flex; gap:2px; align-items:flex-end; height:12px; }
  .eq i{ width:3px; background:var(--accent); animation:eq .9s ease-in-out infinite; }
  .eq i:nth-child(2){ animation-delay:.2s } .eq i:nth-child(3){ animation-delay:.4s }
  .paused .eq i{ animation-play-state:paused; }
  @keyframes eq{ 0%,100%{height:3px} 50%{height:12px} }

  /* 하단 플레이어 */
  .player{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    height:calc(var(--player-h) + env(safe-area-inset-bottom,0px));
    padding:0 18px env(safe-area-inset-bottom,0px);
    background:rgba(20,20,24,.86); backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4);
    border-top:1px solid var(--line);
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:14px;
    transform:translateY(110%); transition:transform .35s ease;
  }
  .player.on{ transform:none; }
  .p-left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .p-video{
    width:96px; height:54px; border-radius:6px; overflow:hidden; background:#000; flex:none; position:relative;
    transition:all .3s ease;
  }
  .p-video iframe, .p-video #ytPlayer{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .p-video.big{
    position:fixed; right:18px; bottom:calc(var(--player-h) + env(safe-area-inset-bottom,0px) + 14px);
    width:min(560px,calc(100vw - 36px)); height:auto; aspect-ratio:16/9; border-radius:12px;
    box-shadow:0 18px 50px rgba(0,0,0,.7); z-index:70;
  }
  .p-info{ min-width:0; }
  .p-title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .p-artist{ font-size:12.5px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .p-artist:hover{ color:var(--text); text-decoration:underline; }
  .p-ctrl{ display:flex; align-items:center; gap:6px; }
  .ic{
    width:38px; height:38px; border-radius:50%; border:0; background:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:var(--text);
  }
  .ic svg{ width:18px; height:18px; fill:currentColor; }
  .ic:hover{ background:rgba(255,255,255,.07); }
  .ic.main{ width:46px; height:46px; background:var(--text); color:#111; }
  .ic.main:hover{ background:#fff; }
  .ic.main svg{ width:20px; height:20px; }
  .ic.toggle.active{ color:var(--accent); }
  .p-right{ display:flex; justify-content:flex-end; align-items:center; gap:4px; }
  .p-right a.ic{ text-decoration:none; }
  .p-note{ font-size:11.5px; color:#f0a39c; max-width:240px; text-align:right; line-height:1.4; }

  footer{ padding:70px 6vw 30px; color:var(--text-dim); font-size:12px; }
  footer .foot-title{ font-family:'EB Garamond',serif; letter-spacing:.22em; font-size:12px; margin-bottom:6px; color:var(--text); opacity:.7; }
  footer .foot-note{ line-height:1.6; }

  @media (max-width:640px){
    .grid{ grid-template-columns:repeat(2,1fr); gap:22px 14px; }
    .art .play-fab{ opacity:1; transform:none; width:34px; height:34px; }
    .hero{ gap:20px; }
    .track{ grid-template-columns:26px 1fr auto; gap:10px; padding:8px 4px; }
    .player{ grid-template-columns:minmax(0,1fr) auto; padding-left:12px; padding-right:10px; }
    .p-right{ display:none; }
    .p-video{ width:72px; height:40px; }
    .p-ctrl .ic.opt{ display:none; }
  }

</style>
</head>
<body>

<div id="app-content">
<header>
  <h1>My Jukebox</h1>
  <p class="tagline">Welcome to <em>My Jukebox</em>. 검색할 필요 없이, 듣고 싶은 노래를 바로.</p>
</header>

<div class="toolbar">
  <div class="stat" id="stat"></div>
  <div class="tools">
    <div class="seg" id="sortSeg" role="group" aria-label="정렬">
      <button data-sort="recent" class="active">최근 추가순</button>
      <button data-sort="name">이름순</button>
      <button data-sort="count">곡 많은 순</button>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="가수·노래 제목으로 검색...">
    </div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <p class="foot-title">MY JUKEBOX PROJECT</p>
  <p class="foot-note">모든 음악은 YouTube에서 재생됩니다.</p>
</footer>
</div>

<!-- 가수(앨범) 상세 -->
<section class="detail" id="detail" aria-hidden="true">
  <div class="detail-bg" id="detailBg"></div>
  <button class="back" id="backBtn" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    보관함
  </button>
  <div class="hero" id="hero"></div>
  <ol class="tracks" id="tracks"></ol>
</section>

<!-- 하단 플레이어 -->
<div class="player" id="player">
  <div class="p-left">
    <div class="p-video" id="pVideo"><div id="ytPlayer"></div></div>
    <div class="p-info">
      <div class="p-title" id="pTitle">—</div>
      <div class="p-artist" id="pArtist"></div>
    </div>
  </div>
  <div class="p-ctrl">
    <button class="ic toggle opt" id="shuffleBtn" title="셔플" aria-label="셔플"><svg viewBox="0 0 24 24"><path d="M17 3h4v4h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H17V3zM3 5h2.6l12 12H19v-1h2v4h-4v-2h.6L5.2 7H3V5zm0 12h2.2l3.4-3.4 1.4 1.4L6 19H3v-2z"/></svg></button>
    <button class="ic" id="prevBtn" title="이전 곡" aria-label="이전 곡"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="ic main" id="playBtn" title="재생/일시정지" aria-label="재생/일시정지"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
    <button class="ic" id="nextBtn" title="다음 곡" aria-label="다음 곡"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    <button class="ic toggle opt" id="repeatBtn" title="반복" aria-label="반복"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
  </div>
  <div class="p-right">
    <span class="p-note" id="pNote"></span>
    <button class="ic" id="bigBtn" title="영상 크게 보기" aria-label="영상 크게 보기"><svg viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg></button>
    <a class="ic" id="ytOpen" href="#" target="_blank" rel="noopener" title="YouTube에서 열기" aria-label="YouTube에서 열기"><svg viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.4l-9.3 9.3-1.4-1.4L17.6 5H14V3zM5 5h6v2H5v12h12v-6h2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg></a>
  </div>
</div>

<script>
  /* =====================================================================
     주크박스 데이터 — 가수 한 명 = 앨범(썸네일) 하나
     ---------------------------------------------------------------------
     { name: '가수 이름',
       alt:  '영문/다른 표기 (선택)',
       (표지: 아래 COVERS에 가수 이름으로 넣음 — 없으면 첫 곡 유튜브 썸네일을 정사각으로 잘라 씀)
       tracks: [
         { url:'https://youtu.be/영상ID', title:'노래 제목', live:true(라이브면), alt:'검색용 다른 이름(선택)', added:'2026-11-18 23:59' },
       ] }
     ===================================================================== */
  const ARTISTS = [
    { name:'최유리', alt:'Choi Yu Ree', tracks:[
      { url:'https://youtu.be/COcuU8LKawk', title:'숲', added:'2026-11-18 23:32' },
    ] },
    { name:'이승철', alt:'Lee Seung Chul', tracks:[
      { url:'https://youtu.be/gZNhBPF9Py4', title:'일기장', added:'2026-11-18 23:51' },
      { url:'https://youtu.be/R05FtOb5Hz8', title:'서쪽하늘', added:'2026-11-18 23:51' },
      { url:'https://youtu.be/t_fQQ8tvpz0', title:'아마추어', added:'2026-11-19 00:51' },
    ] },
    { name:'조째즈', alt:'Jo Jazz', tracks:[
      { url:'https://youtu.be/tfmwbxBKPh0', title:'모르시나요', added:'2026-11-18 23:57' },
      { url:'https://youtu.be/AKXunBaupzY', title:'만약에 말야', added:'2026-11-19 00:00' },
      { url:'https://youtu.be/TxF8xT1cdfE', title:'사랑', added:'2026-11-19 00:00' },
      { url:'https://youtu.be/-_0_Aua1fvw', title:'그리워 혼자 하는 말', added:'2026-11-19 00:01' },
    ] },
    { name:'이문세', alt:'Lee Moon Sae', tracks:[
      { url:'https://youtu.be/hN59Fd8lrK8', title:'슬픔도 지나고 나면', added:'2026-11-19 00:05' },
      { url:'https://youtu.be/JG2DqTNr4uA', title:'옛사랑', live:true, added:'2026-11-19 00:23' },
    ] },
    { name:'권인하', alt:'Kwon In Ha', tracks:[
      { url:'https://youtu.be/Sov1tXXc9yc', title:'사랑이 사랑을', added:'2026-11-19 00:06' },
    ] },
    { name:'변진섭', alt:'Byun Jin Sub', tracks:[
      { url:'https://youtu.be/B-2ud8A8Zcg', title:'숙녀에게', added:'2026-11-19 00:15' },
    ] },
    { name:'Lewis Capaldi', alt:'루이스 카팔디', tracks:[
      { url:'https://youtu.be/zABLecsR5UE', title:'Someone You Loved', added:'2026-11-19 00:16' },
    ] },
    { name:'웅산', alt:'WoongSan', tracks:[
      { url:'https://youtu.be/nD9UghqaPyk', title:'Yesterday', added:'2026-11-19 00:21' },
      { url:'https://youtu.be/tv8Iu-p63gE', title:"Vivaldi's Song", alt:'비발디송', added:'2026-11-19 00:22' },
    ] },
    { name:'Michael Bublé', alt:'마이클 부블레 Michael Buble', tracks:[
      { url:'https://youtu.be/1AJmKkU5POA', title:"Haven't Met You Yet", added:'2026-11-19 00:25' },
    ] },
    { name:'MAX', alt:'맥스 Max Schneider', tracks:[
      { url:'https://youtu.be/zWxuc8L0W_Y', title:"IT'S YOU", note:'feat. keshi', alt:'잇츠유 키시', added:'2026-11-19 00:31' },

  };

  /* ---------- 도우미 ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fold = s => String(s ?? '').toLowerCase().replace(/\s+/g, '');

  function ytId(t){
    if (t.id) return t.id;
    const u = String(t.url || '');
    const m = u.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
    return m ? m[1] : u.trim();
  }
  const ytThumb = id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
  const ytWatch = id => `https://www.youtube.com/watch?v=${id}`;

  ARTISTS.forEach((a, i) => {
    a._i = i;
    if (!a.cover && COVERS[a.name]) a.cover = COVERS[a.name];
    a.tracks = (a.tracks || []).map((t, k) => ({ ...t, id: ytId(t), _k: k }));
    a._last = a.tracks.reduce((m, t) => (t.added || '') > m ? (t.added || '') : m, '');
  });

  function artHTML(a){
    if (a.cover) return `<img src="${esc(a.cover)}" alt="" loading="lazy">`;
    const first = a.tracks[0];
    if (first) return `<img class="yt" src="${ytThumb(first.id)}" alt="" loading="lazy" onerror="this.remove()">`;
    return `<span class="initial">${esc((a.name || '?').slice(0, 1))}</span>`;
  }
  const PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  const PAUSE_SVG = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>';

  /* ---------- 보관함(그리드) ---------- */
  let sortMode = 'recent';
  const grid = $('#grid'), searchInput = $('#searchInput');

  function renderGrid(){
    const q = fold(searchInput.value.trim());
    const total = ARTISTS.reduce((n, a) => n + a.tracks.length, 0);
    $('#stat').innerHTML = `가수 <b>${ARTISTS.length}</b> · 노래 <b>${total}</b>곡`;

    if (!ARTISTS.length){
      grid.style.display = 'block';
      grid.innerHTML = `<div class="empty">아직 비어 있어요.<br>유튜브 링크를 보내주면 <b>가수별 앨범</b>으로 정리돼 여기에 채워집니다.</div>`;
      return;
    }
    let list = ARTISTS.map(a => {
      if (!q) return { a, hits: [] };
      const nameHit = fold(a.name).includes(q) || fold(a.alt).includes(q);
      const hits = a.tracks.filter(t => fold(t.title).includes(q) || fold(t.alt).includes(q));
      return (nameHit || hits.length) ? { a, hits: nameHit ? [] : hits } : null;
    }).filter(Boolean);

    const byName = (x, y) => x.a.name.localeCompare(y.a.name, 'ko');
    if (sortMode === 'name') list.sort(byName);
    else if (sortMode === 'count') list.sort((x, y) => y.a.tracks.length - x.a.tracks.length || byName(x, y));
    else list.sort((x, y) => (y.a._last).localeCompare(x.a._last) || y.a._i - x.a._i);

    if (!list.length){
      grid.style.display = 'block';
      grid.innerHTML = `<div class="empty">“${esc(searchInput.value)}”에 맞는 가수나 노래가 없어요.</div>`;
      return;
    }
    grid.style.display = '';
    grid.innerHTML = list.map(({ a, hits }) => `
      <div class="card${cur && cur.a === a ? ' now' : ''}" data-i="${a._i}" tabindex="0" role="button" aria-label="${esc(a.name)} 열기">
        <div class="art">${artHTML(a)}
          ${a.tracks.length ? `<button class="play-fab" data-play="${a._i}" aria-label="${esc(a.name)} 재생">${PLAY_SVG}</button>` : ''}
        </div>
        <div class="name">${esc(a.name)}</div>
        <div class="sub">${hits.length ? '♪ ' + esc(hits[0].title) + (hits.length > 1 ? ` 외 ${hits.length - 1}곡` : '') : `${a.tracks.length}곡`}</div>
      </div>`).join('');
  }

  grid.addEventListener('click', e => {
    const fab = e.target.closest('[data-play]');
    if (fab){ e.stopPropagation(); playArtist(+fab.dataset.play, 0); return; }
    const card = e.target.closest('.card');
    if (card) openArtist(+card.dataset.i);
  });
  grid.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.classList.contains('card')) openArtist(+e.target.dataset.i);
  });
  searchInput.addEventListener('input', renderGrid);
  $('#sortSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    sortMode = b.dataset.sort;
    [...$('#sortSeg').children].forEach(x => x.classList.toggle('active', x === b));
    renderGrid();
  });

  /* ---------- 가수 상세 (노래 목록) ---------- */
  const detail = $('#detail');
  let openIdx = -1;

  function openArtist(i, fromHash){
    const a = ARTISTS[i]; if (!a) return;
    openIdx = i;
    const first = a.tracks[0];
    $('#detailBg').style.backgroundImage = a.cover ? `url("${a.cover}")` : first ? `url("${ytThumb(first.id)}")` : 'none';
    $('#hero').innerHTML = `
      <div class="art">${artHTML(a)}</div>
      <div class="meta">
        <div class="kind">Artist</div>
        <h2>${esc(a.name)}</h2>
        ${a.alt ? `<div class="alt">${esc(a.alt)}</div>` : ''}
        <div class="cnt">${a.tracks.length}곡</div>
        <div class="actions">
          <button class="btn primary" id="playAll"${a.tracks.length ? '' : ' disabled'}>${PLAY_SVG}재생</button>
          <button class="btn ghost" id="shuffleAll"${a.tracks.length > 1 ? '' : ' disabled'}><svg viewBox="0 0 24 24"><path d="M17 3h4v4h-2V6.4l-4.3 4.3-1.4-1.4L17.6 5H17V3zM3 5h2.6l12 12H19v-1h2v4h-4v-2h.6L5.2 7H3V5zm0 12h2.2l3.4-3.4 1.4 1.4L6 19H3v-2z"/></svg>셔플</button>
        </div>
      </div>`;
    $('#playAll').onclick = () => { setShuffle(false); playArtist(i, 0); };
    $('#shuffleAll').onclick = () => { setShuffle(true); playArtist(i, -1); };
    renderTracks();
    detail.classList.add('open');
    detail.setAttribute('aria-hidden', 'false');
    detail.scrollTop = 0;
    document.body.style.overflow = 'hidden';
    if (!fromHash){ try { location.hash = encodeURIComponent(a.name); } catch(_){} }
  }

  function renderTracks(){
    const a = ARTISTS[openIdx]; if (!a) return;
    const nowId = cur && cur.a === a ? cur.t._k : -1;
    $('#tracks').innerHTML = a.tracks.length ? a.tracks.map((t, k) => `
      <li class="track${k === nowId ? ' playing' + (isPlaying ? '' : ' paused') : ''}" data-k="${k}">
        <span class="no">${k === nowId ? '<span class="eq"><i></i><i></i><i></i></span>' : k + 1}</span>
        <span class="tt"><div class="t">${esc(t.title || '(제목 없음)')}${t.live ? '<span class="badge">LIVE</span>' : ''}</div>${t.note ? `<div class="m">${esc(t.note)}</div>` : ''}</span>
        <a class="yt-link" href="${ytWatch(t.id)}" target="_blank" rel="noopener" title="YouTube에서 열기" aria-label="YouTube에서 열기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      </li>`).join('') : `<li class="empty">아직 노래가 없어요.</li>`;
  }

  $('#tracks').addEventListener('click', e => {
    if (e.target.closest('.yt-link')) return;
    const li = e.target.closest('.track'); if (!li) return;
    const k = +li.dataset.k;
    if (cur && cur.a === ARTISTS[openIdx] && cur.t._k === k){ togglePlay(); return; }
    playArtist(openIdx, k);
  });

  function closeArtist(fromHash){
    detail.classList.remove('open');
    detail.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    openIdx = -1;
    if (!fromHash && location.hash){ try { history.pushState('', document.title, location.pathname + location.search); } catch(_){ location.hash = ''; } }
  }
  $('#backBtn').addEventListener('click', () => closeArtist());
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('#pVideo').classList.contains('big')) toggleBig();
      else if (detail.classList.contains('open')) closeArtist();
    }
  });
  function routeFromHash(){
    const name = decodeURIComponent(location.hash.slice(1) || '');
    const i = ARTISTS.findIndex(a => a.name === name);
    if (i >= 0) openArtist(i, true); else if (detail.classList.contains('open')) closeArtist(true);
  }
  window.addEventListener('hashchange', routeFromHash);

  /* ---------- 플레이어 (YouTube IFrame API) ---------- */
  let yt = null, ytReady = false, pendingId = null;
  let cur = null;            // { a, t }
  let queue = [], qpos = 0;  // 재생 순서(곡 인덱스 배열)
  let shuffle = false, repeat = false, isPlaying = false;

  function loadYT(){
    if (window.YT && window.YT.Player) return onYouTubeIframeAPIReady();
    if (document.getElementById('ytApi')) return;
    const s = document.createElement('script');
    s.id = 'ytApi'; s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => note('YouTube에 연결할 수 없어요. 곡 옆 ↗ 버튼으로 열어 주세요.');
    document.head.appendChild(s);
  }
  window.onYouTubeIframeAPIReady = function(){
    if (yt) return;
    yt = new YT.Player('ytPlayer', {
      width: '100%', height: '100%',
      videoId: pendingId || undefined,
      playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => { ytReady = true; if (pendingId){ yt.loadVideoById(pendingId); pendingId = null; } },
        onStateChange: e => {
          if (e.data === YT.PlayerState.PLAYING){ setPlaying(true); note(''); }
          else if (e.data === YT.PlayerState.PAUSED){ setPlaying(false); }
          else if (e.data === YT.PlayerState.ENDED){ setPlaying(false); next(true); }
        },
        onError: e => {
          setPlaying(false);
          if (e.data === 101 || e.data === 150){
            note('이 영상은 다른 곳에서 재생이 막혀 있어요 → ↗ YouTube에서 열기');
            if (queue.length > 1) setTimeout(() => next(true), 3500);
          } else if (e.data === 153 || e.data === 152){
            note('웹사이트에 올려서 열어야 재생돼요 (파일로 직접 열면 막힘). ↗로 열 수 있어요.');
          } else {
            note('재생할 수 없는 영상이에요 → ↗ YouTube에서 열기');
          }
        }
      }
    });
  };

  function note(msg){ $('#pNote').textContent = msg; }

  function buildQueue(a, startK){
    const idx = a.tracks.map((_, k) => k);
    if (shuffle){
      for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      if (startK >= 0){ idx.splice(idx.indexOf(startK), 1); idx.unshift(startK); }
      queue = idx; qpos = 0;
    } else {
      queue = idx; qpos = Math.max(0, startK);
    }
  }

  function playArtist(i, k){
    const a = ARTISTS[i]; if (!a || !a.tracks.length) return;
    buildQueue(a, k);
    playAt(a, queue[qpos]);
  }

  function playAt(a, k){
    const t = a.tracks[k]; if (!t) return;
    cur = { a, t };
    $('#player').classList.add('on');
    $('#pTitle').textContent = t.title || '(제목 없음)';
    $('#pArtist').textContent = a.name;
    $('#ytOpen').href = ytWatch(t.id);
    note('');
    if (ytReady) yt.loadVideoById(t.id);
    else { pendingId = t.id; loadYT(); }
    setMediaSession();
    renderTracks(); markNowCard();
  }

  function next(auto){
    if (!cur) return;
    if (qpos < queue.length - 1) qpos++;
    else if (repeat || !auto) qpos = 0;
    else return;
    playAt(cur.a, queue[qpos]);
  }
  function prev(){
    if (!cur) return;
    if (ytReady && yt.getCurrentTime && yt.getCurrentTime() > 4){ yt.seekTo(0, true); return; }
    qpos = qpos > 0 ? qpos - 1 : queue.length - 1;
    playAt(cur.a, queue[qpos]);
  }
  function togglePlay(){
    if (!cur || !ytReady) return;
    isPlaying ? yt.pauseVideo() : yt.playVideo();
  }
  function setPlaying(v){
    isPlaying = v;
    $('#playBtn').innerHTML = v ? PAUSE_SVG : PLAY_SVG;
    const li = document.querySelector('.track.playing');
    if (li) li.classList.toggle('paused', !v);
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = v ? 'playing' : 'paused';
  }
  function setShuffle(v){
    shuffle = v; $('#shuffleBtn').classList.toggle('active', v);
  }
  function markNowCard(){
    document.querySelectorAll('.card').forEach(c => c.classList.toggle('now', cur && +c.dataset.i === cur.a._i));
  }
  function toggleBig(){
    const v = $('#pVideo');
    v.classList.toggle('big');
    $('#bigBtn').classList.toggle('active', v.classList.contains('big'));
  }

  function setMediaSession(){
    if (!('mediaSession' in navigator) || !cur) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: cur.t.title || '', artist: cur.a.name,
        artwork: [{ src: cur.a.cover || ytThumb(cur.t.id), sizes: '480x360', type: 'image/jpeg' }]
      });
      navigator.mediaSession.setActionHandler('nexttrack', () => next());
      navigator.mediaSession.setActionHandler('previoustrack', () => prev());
    } catch(_){}
  }

  $('#playBtn').addEventListener('click', togglePlay);
  $('#nextBtn').addEventListener('click', () => next());
  $('#prevBtn').addEventListener('click', prev);
  $('#bigBtn').addEventListener('click', toggleBig);
  $('#shuffleBtn').addEventListener('click', () => {
    setShuffle(!shuffle);
    if (cur){ const k = cur.t._k; buildQueue(cur.a, k); if (!shuffle) qpos = k; }
  });
  $('#repeatBtn').addEventListener('click', () => {
    repeat = !repeat; $('#repeatBtn').classList.toggle('active', repeat);
  });
  $('#pArtist').addEventListener('click', () => { if (cur) openArtist(cur.a._i); });

  renderGrid();
  if (location.hash) routeFromHash();

</script>

</body>
</html>
